<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pysearch — from-scratch full-text search</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
          --accent: #38bdf8; --border: #334155; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         margin: 0; padding: 2rem 1rem; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .95rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .7rem .9rem; font-size: 1rem; border-radius: .5rem;
                     border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button { padding: .7rem 1.2rem; font-size: 1rem; border: 0; border-radius: .5rem;
           background: var(--accent); color: #082f49; font-weight: 700; cursor: pointer; }
  .hint { color: var(--muted); font-size: .85rem; margin: .75rem 0 1.5rem; }
  .hint code { background: var(--card); padding: .1rem .35rem; border-radius: .3rem;
               border: 1px solid var(--border); }
  .result { background: var(--card); border: 1px solid var(--border); border-radius: .6rem;
            padding: 1rem 1.1rem; margin-bottom: .8rem; }
  .result .id { font-weight: 700; }
  .result .score { float: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  .result .snippet { color: var(--muted); font-size: .92rem; margin-top: .4rem; line-height: 1.45; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>py<span>search</span></h1>
  <p class="sub">A from-scratch full-text search engine — inverted index + TF-IDF, no dependencies.</p>
  <form id="f">
    <input type="text" id="q" placeholder="Try: esp32  •  &quot;deep sleep&quot;  •  python AND flask  •  lora NOT bluetooth" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <p class="hint">Supports <code>"exact phrases"</code>, <code>AND</code>, <code>OR</code>, <code>NOT</code>, and <code>(parentheses)</code>.</p>
  <div id="results"></div>
</div>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), out = document.getElementById('results');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const query = q.value.trim();
  if (!query) return;
  out.innerHTML = '<p class="empty">Searching…</p>';
  const res = await fetch('/search?q=' + encodeURIComponent(query));
  const data = await res.json();
  if (!data.results.length) { out.innerHTML = '<p class="empty">No results.</p>'; return; }
  out.innerHTML = data.results.map(r =>
    `<div class="result"><span class="score">${r.score.toFixed(4)}</span>` +
    `<span class="id">${r.doc_id}</span><div class="snippet">${r.snippet}</div></div>`
  ).join('');
});
</script>
</body>
</html>
